[project]
name = "hnet-impl"
version = "0.1.0"
description = ""
authors = [
    { email = "187762902+main-horse@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
  "torch==2.7.1",
  "mamba-ssm",
  "termcolor>=3.1.0",
  "omegaconf>=2.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/hnet_impl"]

[project.optional-dependencies]
build = [
    "flash-attn==2.8.1",
    "causal-conv1d==1.5.2",
]

[tool.uv.sources]
mamba-ssm = { git = "https://github.com/main-horse/mamba", rev = "tc" }

[tool.uv.extra-build-dependencies]
flash-attn = [{ requirement = "torch", match-runtime = true }]
mamba-ssm = [{ requirement = "torch", match-runtime = true }]
causal-conv1d = [{ requirement = "torch", match-runtime = true }]

[tool.uv.extra-build-variables]
causal-conv1d = { CAUSAL_CONV1D_SKIP_CUDA_BUILD = "TRUE" }

[dependency-groups]
dev = [
    "lovely-tensors",
    "pytest>=8.4.1",
    "ruff>=0.12.9",
]


[tool.ruff.lint]
ignore = [
    "E701",  # multiple statements on one line (colon)
    "E741",  # ambiguous variable name
    "F401",  # imported but unused
    "F403",  # 'from module import *' used
    "F821",  # Undefined name `HNetLM`
]
